# App stack: PostgreSQL + API + web. Code execution (Judge0) is in docker-compose.judge0.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  # Needs the sandbox from docker-compose.judge0.yml running first (docker network `codearena_sandbox`).
  # Start with: docker compose --profile execution up --build
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    profiles: ["execution"]
    depends_on:
      db: { condition: service_healthy }
    networks: [default, sandbox]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pgdata:

networks:
  sandbox:
    name: codearena_sandbox
    external: true
