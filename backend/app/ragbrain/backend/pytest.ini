[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    integration: marks tests that require real external services (deselect with -m "not integration")
    slow: marks slow tests
addopts =
    -v
    --tb=short
    -m "not integration"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
