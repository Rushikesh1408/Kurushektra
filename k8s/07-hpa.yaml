apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cognicode-backend-hpa
  namespace: cognicode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cognicode-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cognicode-frontend-hpa
  namespace: cognicode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cognicode-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
