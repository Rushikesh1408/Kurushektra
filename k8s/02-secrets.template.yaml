# Template: Apply via `kubectl apply -f -` with secrets injected from Vault, AWS Secrets Manager, or SealedSecrets.
# DO NOT commit actual base64 secret values to version control.
apiVersion: v1
kind: Secret
metadata:
  name: cognicode-secrets
  namespace: cognicode
  labels:
    app.kubernetes.io/name: cognicode
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://user:password@managed-postgres.internal:5432/cognicode"
  JWT_SECRET: "replace-with-64-character-cryptographically-random-secret-key"
  LLM_API_KEY: "replace-with-authorized-llm-api-key"
  JUDGE0_AUTH_TOKEN: "replace-with-judge0-internal-token"
